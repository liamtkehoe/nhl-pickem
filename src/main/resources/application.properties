spring.application.name=nhl-pickem

spring.datasource.url=jdbc:sqlite:data/pickem.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1
spring.sql.init.mode=always
spring.config.import=optional:file:./config/award-weights.properties

pickem.current-season=20262027
pickem.games-per-season=84
pickem.sync.enabled=true