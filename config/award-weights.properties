#Award formula weights. Restart app after changing
#Check with: GET /api/admin/award-candidates/{award}

pickem.awards.min-games-share=0.5

#Hart (and Norris production): goal-weight x goals + assists
pickem.awards.goal-weight=2.0
pickem.awards.goalie-penalty=1.0

#Goalie score for Hart and Calder
pickem.awards.mvp-goalie-save-pct=0.4
pickem.awards.mvp-goalie-gaa=0.3
pickem.awards.mvp-goalie-wins=0.2
pickem.awards.mvp-goalie-shutouts=0.1

#Calder: (calder-goal-weight x goals + assists), x calder-defense-multiplier for defensemen
pickem.awards.calder-goal-weight=1.5
pickem.awards.calder-defense-multiplier=1.15
pickem.awards.calder-goalie-penalty=0.5

pickem.awards.vezina-save-pct=0.6
pickem.awards.vezina-wins=0.25
pickem.awards.vezina-gaa=0.15

pickem.awards.norris-production=0.75
pickem.awards.norris-plus-minus=0.15
pickem.awards.norris-take-give=0.10

#Selke: forwards averaging at least this many PK seconds per game
pickem.awards.selke-min-pk-seconds=90
pickem.awards.selke-plus-minus=0.25
pickem.awards.selke-take-give=0.15
pickem.awards.selke-blocks=0.15
pickem.awards.selke-pk-time=0.30
pickem.awards.selke-pk-goals-against=0.15
pickem.awards.selke-min-points-per-game=0.5